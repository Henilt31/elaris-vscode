<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Elaris Theme — Clarity, light, and code.">
  <title>Elaris Theme Workspace</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body class="theme-elaris">
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#5B4BDB" stroke-width="2"/>
        <path d="M12 2V6M12 18V22M2 12H6M18 12H22" stroke="#1687C8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">ELARIS</span>
    </div>
    <nav class="navigation">
      <a href="#overview" class="nav-item is-active">Overview</a>
      <a href="#palette" class="nav-item">Palette</a>
      <a href="#docs" class="nav-item">Documentation</a>
    </nav>
  </header>

  <main class="content-wrapper">
    <section class="hero-block">
      <h1 class="main-title">Clarity, light, and code.</h1>
      <p class="summary-text">A clean VS Code theme designed for focused daylight coding.</p>
      <div class="actions">
        <button type="button" class="btn btn-primary">Install Theme</button>
        <a href="https://github.com/Henilt31/elaris-vscode" class="btn btn-secondary">Source Code</a>
      </div>
    </section>
  </main>
</body>
</html>
